*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --mesa:#ECEEF6; --carton:#FFFFFF; --carton-2:#F4F5FA;
  --tinta:#191C3A; --tinta-2:#5A5F80; --linea:#D5D8E7; --pieza:#191C3A;
  --amarillo:#F2B705; --on-amarillo:#2A1F00;
  --frambuesa:#D62D66; --on-frambuesa:#FFFFFF;
  --cobalto:#2F49D8; --on-cobalto:#FFFFFF;
  --jade:#0B7F61; --on-jade:#FFFFFF;
  --noche:#191C3A; --on-noche:#FFFFFF;
  --bien:#0B7F61; --mal:#C42A55;
  --tinte-bien:rgba(11,127,97,.10); --tinte-mal:rgba(214,45,102,.08);
  --foco:#2F49D8;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mesa:#12142B; --carton:#1C1F3F; --carton-2:#242851;
    --tinta:#EEF0FF; --tinta-2:#A8ADD3; --linea:#363B66; --pieza:#05060F;
    --amarillo:#FFC629; --on-amarillo:#241A00;
    --frambuesa:#FF5C8F; --on-frambuesa:#1A0610;
    --cobalto:#7D8FFF; --on-cobalto:#0B0F33;
    --jade:#2BD3A3; --on-jade:#04241B;
    --noche:#EEF0FF; --on-noche:#12142B;
    --bien:#2BD3A3; --mal:#FF5C8F;
    --tinte-bien:rgba(43,211,163,.12); --tinte-mal:rgba(255,92,143,.10);
    --foco:#9AA8FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --mesa:#12142B; --carton:#1C1F3F; --carton-2:#242851;
  --tinta:#EEF0FF; --tinta-2:#A8ADD3; --linea:#363B66; --pieza:#05060F;
  --amarillo:#FFC629; --on-amarillo:#241A00;
  --frambuesa:#FF5C8F; --on-frambuesa:#1A0610;
  --cobalto:#7D8FFF; --on-cobalto:#0B0F33;
  --jade:#2BD3A3; --on-jade:#04241B;
  --noche:#EEF0FF; --on-noche:#12142B;
  --bien:#2BD3A3; --mal:#FF5C8F;
  --tinte-bien:rgba(43,211,163,.12); --tinte-mal:rgba(255,92,143,.10);
  --foco:#9AA8FF;
  color-scheme:dark;
}
html{background:var(--mesa); scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px); -webkit-text-size-adjust:100%}
body{margin:0; min-height:100%; background:var(--mesa); color:var(--tinta);
  font-family:"Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  font-size:1rem; line-height:1.5; -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--mesa)}
h1,h2,h3,p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--foco); outline-offset:2px}

/* Barra superior */
.barra{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--mesa)}
.barra-in{max-width:36rem; margin:0 auto; display:flex; align-items:center; gap:4px; padding:8px 12px; min-height:60px}
.marca{display:inline-flex; align-items:center; gap:10px; margin-right:auto; padding:6px 8px; border-radius:10px; color:var(--tinta); text-decoration:none; font-weight:800; font-size:1.125rem; letter-spacing:-.01em}
.marca svg{width:34px; height:26px; flex:none}
.btn-icono{display:inline-grid; place-items:center; width:44px; height:44px; flex:none; border:0; border-radius:50%; background:transparent; color:var(--tinta); cursor:pointer; text-decoration:none}
.btn-icono svg{width:24px; height:24px}
.btn-icono:active{background:var(--carton-2)}
.btn-icono[disabled]{opacity:.3; cursor:default}

/* Contenedor */
.app{--c:var(--cobalto); --on-c:var(--on-cobalto); max-width:36rem; margin:0 auto; padding:4px 20px 120px; outline:none}
.nivel-1{--c:var(--amarillo); --on-c:var(--on-amarillo)}
.nivel-2{--c:var(--frambuesa); --on-c:var(--on-frambuesa)}
.nivel-3{--c:var(--cobalto); --on-c:var(--on-cobalto)}
.nivel-4{--c:var(--jade); --on-c:var(--on-jade)}
.nivel-meta{--c:var(--noche); --on-c:var(--on-noche)}
.v1{--vc:var(--amarillo); --on-vc:var(--on-amarillo)}
.v2{--vc:var(--frambuesa); --on-vc:var(--on-frambuesa)}
.v3{--vc:var(--cobalto); --on-vc:var(--on-cobalto)}
.v4{--vc:var(--jade); --on-vc:var(--on-jade)}

/* Héroe: tres naipes */
.heroe{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:8px; margin:6px 0 16px}
.heroe h1{font-size:clamp(3.5rem,18vw,5.5rem); line-height:.84; letter-spacing:-.05em; font-weight:800; font-variation-settings:"opsz" 96}
.entradilla{font-size:1.125rem; line-height:1.45; max-width:30em}
.abanico{position:relative; width:142px; height:118px; margin-right:6px}
.naipe{position:absolute; left:40px; bottom:4px; width:60px; height:86px; display:grid; place-items:center; border:2.5px solid var(--pieza); border-radius:10px; box-shadow:3px 4px 0 var(--pieza); font-size:2.1rem; font-weight:800; transform-origin:50% 140%}
.naipe::before{content:attr(data-n); position:absolute; top:3px; left:7px; font-size:.75rem; font-weight:800}
.naipe.v1{background:var(--amarillo); color:var(--on-amarillo); transform:rotate(-18deg)}
.naipe.v2{background:var(--frambuesa); color:var(--on-frambuesa); transform:translateY(-6px)}
.naipe.v3{background:var(--cobalto); color:var(--on-cobalto); transform:rotate(18deg)}
.abanico.anim .naipe{animation:abrir .8s cubic-bezier(.25,1.4,.4,1) both}
.abanico.anim .naipe.v2{animation-delay:.08s}
.abanico.anim .naipe.v3{animation-delay:.16s}
@keyframes abrir{from{transform:translateY(30px); opacity:0}}

/* Tablero de casillas */
.tablero{list-style:none; margin:24px 0 8px; padding:0; display:grid; gap:22px}
.tablero li{display:flex}
.tablero li:nth-child(even){justify-content:flex-end}
.casilla{position:relative; display:block; width:86%; padding:14px 16px 16px; border:2.5px solid var(--pieza); border-radius:20px; background:var(--c); color:var(--on-c); text-decoration:none; box-shadow:4px 5px 0 var(--pieza); transition:transform .1s, box-shadow .1s}
.casilla:active{transform:translate(3px,4px); box-shadow:1px 1px 0 var(--pieza)}
.tablero li:not(:last-child) .casilla::after{content:""; position:absolute; top:100%; left:58%; margin-top:5px; height:15px; border-left:3px dotted var(--tinta-2)}
.tablero li:nth-child(even):not(:last-child) .casilla::after{left:42%}
.cas-cab{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px}
.num{display:inline-grid; place-items:center; width:34px; height:34px; flex:none; border:2.5px solid var(--pieza); border-radius:50%; background:var(--carton); color:var(--tinta); font-weight:800; font-size:1rem}
.num svg{width:20px; height:20px}
.cas-estado{font-size:.8125rem; font-weight:700; text-align:right}
.cas-tit{display:block; font-size:1.375rem; line-height:1.08; font-weight:800; letter-spacing:-.015em}
.cas-desc{display:block; margin-top:4px; font-size:.9375rem; line-height:1.35}
.barrita{display:block; height:8px; margin-top:12px; border-radius:99px; background:rgba(128,128,128,.3); overflow:hidden}
.barrita i{display:block; height:100%; width:var(--p,0%); border-radius:99px; background:var(--on-c)}

/* Logros */
.logros-sec{margin-top:32px}
.logros-sec h2{font-size:1.25rem; font-weight:750; margin-bottom:12px}
.logros{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:14px 8px}
.logro{display:flex; flex-direction:column; align-items:center; gap:6px; width:100%; padding:0; border:0; background:none; color:var(--tinta-2); font:inherit; font-size:.75rem; font-weight:700; line-height:1.2; text-align:center; cursor:pointer}
.logro .disco{display:grid; place-items:center; width:58px; height:58px; border:2.5px dashed var(--linea); border-radius:50%; color:var(--linea)}
.logro .disco svg{width:26px; height:26px}
.logro.si{color:var(--tinta)}
.logro.si .disco{border:2.5px solid var(--pieza); background:var(--c); color:var(--on-c); box-shadow:2px 3px 0 var(--pieza)}

/* Cabecera de casilla */
.cabecera{margin:6px 0 20px; padding:16px 18px 18px; border:2.5px solid var(--pieza); border-radius:22px; background:var(--c); color:var(--on-c); box-shadow:4px 5px 0 var(--pieza)}
.cabecera h1{margin:12px 0 6px; font-size:2.125rem; line-height:1; letter-spacing:-.03em; font-weight:800}
.cabecera h1:first-child{margin-top:0}
.cabecera p{font-size:1rem; line-height:1.45; max-width:34em}
.cabecera .dur{margin-top:12px; font-weight:700; font-size:.9375rem}
.cabecera .btn-txt{color:inherit; padding-left:0; margin-top:2px}
.titulo-pag{margin:8px 0 16px; font-size:2.25rem; line-height:1; letter-spacing:-.03em; font-weight:800}

/* Paneles y texto */
.panel{margin:0 0 14px; padding:18px; border:1px solid var(--linea); border-radius:16px; background:var(--carton)}
.panel h2{margin-bottom:4px; font-size:1.25rem; line-height:1.2; font-weight:750; letter-spacing:-.01em}
.panel h3{margin:16px 0 8px; font-size:1rem; font-weight:750}
.panel h3:first-child{margin-top:0}
.ayuda{margin:0 0 14px; color:var(--tinta-2); font-size:.9375rem; line-height:1.45}
.panel>.ayuda:last-child{margin-bottom:0}
.nota{margin-top:12px; color:var(--tinta-2); font-size:.875rem}
.centro{text-align:center}
.aviso{margin:0 0 14px; padding:12px 14px; border-left:4px solid var(--c); border-radius:12px; background:var(--carton); font-size:.9375rem}
.aviso-almacen{margin-top:14px; border-left-color:var(--mal); font-weight:600}
.cita{margin-top:12px; padding:12px 14px; border-radius:12px; background:var(--carton-2); line-height:1.45}
.dos{display:grid; gap:16px}
@media (min-width:30rem){ .dos{grid-template-columns:1fr 1fr} }
.simple{margin:4px 0 0; padding-left:1.1em; display:grid; gap:4px}

/* Formularios */
.campo{display:block; margin:0 0 14px}
.campo:last-child{margin-bottom:0}
.campo.sep{margin-top:20px}
.campo>span, legend{display:block; margin:0 0 6px; padding:0; font-weight:700; font-size:.9375rem}
fieldset{min-width:0; margin:0 0 16px; padding:0; border:0}
input[type=text], input[type=date], textarea{display:block; width:100%; min-height:48px; padding:11px 14px; border:2px solid var(--linea); border-radius:12px; background:var(--carton-2); color:var(--tinta); font:inherit; font-size:1rem; -webkit-appearance:none; appearance:none}
textarea{min-height:84px; line-height:1.45; resize:vertical}
input::placeholder, textarea::placeholder{color:var(--tinta-2); opacity:.75}
input:focus, textarea:focus{outline:none; border-color:var(--foco)}
input[type=range]{width:100%; min-height:32px; accent-color:var(--c)}
.escala{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px}
.escala.tres-op{grid-template-columns:repeat(3,minmax(0,1fr))}
.escala button{min-height:50px; padding:4px 2px; border:2px solid var(--linea); border-radius:12px; background:var(--carton-2); color:var(--tinta); font:inherit; font-weight:700; font-size:.8125rem; line-height:1.1; cursor:pointer}
.escala button.num-esc{font-size:1.125rem}
.escala button[aria-pressed="true"]{border-color:var(--pieza); background:var(--c); color:var(--on-c); box-shadow:0 3px 0 var(--pieza); transform:translateY(-1px)}
.escala-ext{display:flex; justify-content:space-between; gap:8px; margin-top:6px; color:var(--tinta-2); font-size:.8125rem}

/* Botones */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 20px; border:2.5px solid var(--pieza); border-radius:999px; background:var(--carton); color:var(--tinta); font:inherit; font-weight:750; font-size:1rem; line-height:1.2; text-decoration:none; cursor:pointer; box-shadow:0 3px 0 var(--pieza); transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(3px); box-shadow:0 0 0 var(--pieza)}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:0 3px 0 var(--pieza)}
.btn svg{width:20px; height:20px}
.btn-prim{background:var(--c); color:var(--on-c)}
.btn-peligro{background:var(--frambuesa); color:var(--on-frambuesa)}
.ancho{display:flex; width:100%}
.btn-txt{display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:8px 6px; border:0; background:none; color:var(--tinta); font:inherit; font-weight:650; text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.btn-txt svg{width:18px; height:18px}
.btn-txt.peligro{color:var(--mal)}
.fila-btn{display:flex; flex-wrap:wrap; gap:10px; margin-top:14px}
.fila-sec{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-top:14px}
.pestanas{display:grid; grid-template-columns:1fr 1fr; gap:4px; margin:0 0 14px; padding:4px; border:1px solid var(--linea); border-radius:999px; background:var(--carton)}
.pestanas button{min-height:42px; border:0; border-radius:999px; background:transparent; color:var(--tinta-2); font:inherit; font-weight:700; cursor:pointer}
.pestanas button[aria-selected="true"]{background:var(--tinta); color:var(--mesa)}
.opciones{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.opciones.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
.opciones button{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:2px; min-height:60px; padding:10px 14px; border:2px solid var(--linea); border-radius:14px; background:var(--carton-2); color:var(--tinta); font:inherit; text-align:left; cursor:pointer}
.opciones button span{color:var(--tinta-2); font-size:.8125rem; font-weight:600}
.opciones button[aria-pressed="true"]{border-color:var(--pieza); background:var(--c); color:var(--on-c); box-shadow:0 3px 0 var(--pieza)}
.opciones button[aria-pressed="true"] span{color:inherit; opacity:.85}
.reglas{margin:6px 0 0; padding-left:1.3em; display:grid; gap:6px}
.reglas li::marker{font-weight:800}

/* Diario */
.dia-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin:-4px -6px 14px}
.dia-nav div{text-align:center; line-height:1.25}
.dia-nav small{display:block; color:var(--tinta-2); font-size:.8125rem; font-weight:650}
.dia-nav strong{font-size:1.0625rem}
.lista-act{list-style:none; margin:0 0 14px; padding:0}
.act{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--linea)}
.act:last-child{border-bottom:0}
.act>div{flex:1; min-width:0}
.act strong{display:block; font-weight:700; overflow-wrap:anywhere}
.act-meta{display:flex; align-items:center; gap:10px; margin-top:2px; color:var(--tinta-2); font-size:.875rem}
.puntos{display:inline-flex; gap:3px}
.puntos i{width:8px; height:8px; border-radius:50%; background:var(--linea)}
.puntos i.on{background:var(--tinta)}
.chip-en{font-weight:700}
.chip-en.pos{color:var(--bien)} .chip-en.neg{color:var(--mal)}
.cuadrante{display:block; width:100%; height:auto; font-family:inherit}
.cuadrante .q-bien{fill:var(--tinte-bien)} .cuadrante .q-mal{fill:var(--tinte-mal)}
.cuadrante .marco{fill:none; stroke:var(--linea); stroke-width:1.5}
.cuadrante .eje{stroke:var(--linea); stroke-width:1.5}
.cuadrante .ax{fill:var(--tinta-2); font-size:11px; font-weight:650}
.cuadrante .pt-bien{fill:var(--bien); fill-opacity:.85} .cuadrante .pt-mal{fill:var(--mal); fill-opacity:.85}
.cuadrante .et{fill:var(--tinta); font-size:11px; font-weight:650; paint-order:stroke; stroke:var(--carton); stroke-width:3px; stroke-linejoin:round}
.leyenda-q{display:grid; gap:6px; margin-top:12px; color:var(--tinta-2); font-size:.875rem}
.leyenda-q span{display:flex; align-items:center; gap:8px}
.leyenda-q i{width:14px; height:14px; flex:none; border-radius:4px}
.leyenda-q i.bien{background:var(--bien)} .leyenda-q i.mal{background:var(--mal)}
.ranking{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:8px}
.ranking li{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:12px; background:var(--carton-2); font-weight:650}
.ranking span{color:var(--tinta-2); font-weight:600; font-size:.875rem; white-space:nowrap}

/* Participantes */
.fichas{display:flex; flex-wrap:wrap; gap:8px; margin:0; padding:0; list-style:none}
.ficha{display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:4px 12px 4px 4px; border:2px solid var(--linea); border-radius:999px; background:var(--carton-2); color:var(--tinta); font:inherit; font-weight:700; text-align:left}
button.ficha{cursor:pointer}
button.ficha[aria-pressed="true"]{border-color:var(--pieza); background:var(--c); color:var(--on-c); box-shadow:0 3px 0 var(--pieza)}
.ficha.v1[aria-pressed="true"], .ficha.v2[aria-pressed="true"], .ficha.v3[aria-pressed="true"]{background:var(--vc); color:var(--on-vc)}
.ficha .x{display:inline-grid; place-items:center; width:30px; height:30px; margin-right:-6px; border:0; border-radius:50%; background:transparent; color:var(--tinta-2); cursor:pointer}
.ficha .x svg{width:18px; height:18px}
.punto{display:inline-block; width:14px; height:14px; flex:none; margin-left:8px; border:2px solid var(--pieza); border-radius:50%; background:var(--vc,var(--c))}
.punto.neutro{background:var(--carton)}
.avatar{display:inline-grid; place-items:center; width:34px; height:34px; flex:none; border-radius:50%; background:var(--pc); color:#fff; font-weight:800; font-size:.875rem}
.avatar.g{width:72px; height:72px; border:3px solid var(--pieza); font-size:1.75rem}
.fila-add{display:flex; gap:8px; margin-top:12px}
.fila-add input{flex:1; min-width:0}

/* Subasta */
.pasa{padding:28px 20px; text-align:center}
.pasa .avatar.g{margin:0 auto 14px}
.pasa h2{font-size:1.5rem; margin-bottom:6px}
.lotes-sel{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.lotes-sel button{display:block; width:100%; padding:12px 14px; border:2px solid var(--linea); border-radius:14px; background:var(--carton-2); color:var(--tinta); font:inherit; text-align:left; cursor:pointer}
.lotes-sel strong{display:block; font-weight:750}
.lotes-sel span{display:block; color:var(--tinta-2); font-size:.875rem}
.lotes-sel button[aria-pressed="true"]{border-color:var(--pieza); background:var(--c); color:var(--on-c); box-shadow:0 3px 0 var(--pieza)}
.lotes-sel button[aria-pressed="true"] span{color:inherit; opacity:.85}
.pie-fijo{position:fixed; left:0; right:0; bottom:0; z-index:15; padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--linea); background:var(--mesa)}
.pie-fijo .btn{max-width:32rem; margin:0 auto}
.bolsas{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin:6px 0}
.bolsa{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--linea); border-radius:14px; background:var(--carton)}
.bolsa span{display:block; color:var(--tinta-2); font-size:.8125rem; font-weight:650; line-height:1.2}
.bolsa b{display:block; font-size:1.125rem; font-variant-numeric:tabular-nums}
.lote{position:relative; margin:18px 4px 24px; padding:22px 20px; border:2.5px solid var(--pieza); border-radius:18px; background:var(--carton); box-shadow:5px 6px 0 var(--pieza); transform:rotate(-1.2deg)}
.lote::after{content:""; position:absolute; top:-13px; right:24px; width:24px; height:24px; border:2.5px solid var(--pieza); border-radius:50%; background:var(--c)}
.lote .n{color:var(--tinta-2); font-size:.875rem; font-weight:700}
.lote h2{margin:6px 0 8px; font-size:1.75rem; line-height:1.08; letter-spacing:-.02em; font-weight:800}
.lote p:last-child{font-size:1.0625rem}
.precio{display:flex; align-items:center; justify-content:center; gap:16px; margin:4px 0 8px}
.precio output{min-width:4ch; text-align:center; font-size:2.5rem; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.btn-redondo{display:grid; place-items:center; width:56px; height:56px; border:2.5px solid var(--pieza); border-radius:50%; background:var(--carton); color:var(--tinta); font:inherit; font-size:1.75rem; font-weight:700; cursor:pointer; box-shadow:0 3px 0 var(--pieza)}
.btn-redondo:active{transform:translateY(3px); box-shadow:none}
.btn-redondo[disabled]{opacity:.35; cursor:not-allowed}
.atajos{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-bottom:14px}
.atajos button{min-height:40px; padding:0 14px; border:2px solid var(--linea); border-radius:999px; background:var(--carton-2); color:var(--tinta); font:inherit; font-weight:700; font-size:.875rem; cursor:pointer}
.atajos button[disabled]{opacity:.4; cursor:not-allowed}
.alerta{margin-bottom:12px; color:var(--mal); font-weight:700; font-size:.9375rem; text-align:center}
.sello{position:fixed; inset:0; z-index:60; display:grid; place-items:center; pointer-events:none}
.sello>div{padding:14px 24px; border:5px solid var(--frambuesa); border-radius:14px; background:var(--carton); color:var(--frambuesa); font-size:2.25rem; font-weight:800; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.25); transform:rotate(-8deg); animation:sellar 1s cubic-bezier(.2,.9,.3,1.2) both}
.sello small{display:block; margin-top:2px; color:var(--tinta); font-size:1rem; font-weight:700}
@keyframes sellar{0%{opacity:0; transform:rotate(-8deg) scale(2.4)} 30%{opacity:1; transform:rotate(-8deg) scale(1)} 80%{opacity:1; transform:rotate(-8deg) scale(1)} 100%{opacity:0; transform:rotate(-8deg) scale(1)}}
.compras{list-style:none; margin:8px 0 0; padding:0}
.compras li{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px dashed var(--linea)}
.compras li:last-child{border-bottom:0}
.compras b{white-space:nowrap; font-variant-numeric:tabular-nums}
.impres{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:8px}
.impres li{display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:12px; background:var(--carton-2)}
.impres li>svg{width:22px; height:22px; flex:none; margin-top:1px}
.impres li.si>svg{color:var(--bien)} .impres li.no>svg{color:var(--mal)}
.impres small{display:block; color:var(--tinta-2); font-size:.875rem}
.anclas{list-style:none; margin:4px 0 0; padding:0; display:grid; gap:12px}
.anclas .fila{display:flex; justify-content:space-between; gap:8px; font-size:.9375rem; font-weight:700}
.anclas .fila em{color:var(--tinta-2); font-style:normal; font-weight:600; font-size:.8125rem}
.anclas small{display:block; margin-bottom:4px; color:var(--tinta-2); font-size:.8125rem}
.barra-a{height:12px; border-radius:99px; background:var(--carton-2); overflow:hidden}
.barra-a i{display:block; height:100%; width:var(--p); border-radius:99px; background:var(--c)}
.trio{margin-top:18px; padding-top:16px; border-top:1px solid var(--linea)}
.trio-g{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:12px}
.trio-g div{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.trio-g .col{position:relative; width:100%; height:90px; border-radius:12px; background:var(--carton-2); overflow:hidden}
.trio-g .col i{position:absolute; left:0; right:0; bottom:0; height:var(--p); background:var(--c)}
.trio-g strong{font-size:.9375rem} .trio-g span{color:var(--tinta-2); font-size:.75rem; line-height:1.2}

/* Tres vidas */
.tipos{list-style:none; margin:4px 0 0; padding:0; display:grid; gap:10px}
.tipos li{padding:12px 14px 12px 16px; border-left:6px solid var(--vc); border-radius:12px; background:var(--carton-2); font-size:.9375rem}
.jv-cab{display:flex; align-items:center; gap:10px; margin-bottom:12px}
.tres{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.mini-plan{display:flex; flex-direction:column; justify-content:space-between; gap:6px; aspect-ratio:3/4; padding:10px; border:2.5px solid var(--pieza); border-radius:12px; background:var(--vc); color:var(--on-vc); font:inherit; text-align:left; cursor:pointer; box-shadow:2px 3px 0 var(--pieza)}
.mini-plan.sin{border-style:dashed; border-color:var(--linea); background:var(--carton-2); color:var(--tinta-2); box-shadow:none}
.mini-plan b{font-size:.8125rem; font-weight:800}
.mini-plan span{display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; font-size:.875rem; font-weight:700; line-height:1.2; overflow-wrap:anywhere}
.plan-cab, .escenario{margin:6px 0 18px; padding:16px 18px 18px; border:2.5px solid var(--pieza); border-radius:22px; background:var(--vc); color:var(--on-vc); box-shadow:4px 5px 0 var(--pieza)}
.plan-cab>span{font-weight:700; font-size:.9375rem}
.plan-cab h1{margin:6px 0; font-size:1.875rem; line-height:1.02; letter-spacing:-.025em; font-weight:800}
.contador{margin-top:-6px; color:var(--tinta-2); font-size:.875rem; font-weight:700}
.contador.ok{color:var(--bien)}
.pregunta{margin-bottom:8px}
.mandos{display:grid; grid-template-columns:1fr 1fr; gap:16px 14px}
.mando{display:flex; flex-direction:column; gap:4px}
.mando label{display:flex; flex-direction:column; gap:4px}
.mando .m-t{display:flex; justify-content:space-between; font-weight:750}
.mando .m-t output{font-variant-numeric:tabular-nums}
.mando .m-d{min-height:3.9em; color:var(--tinta-2); font-size:.8125rem; line-height:1.3}
.gauge{display:block; width:100%; max-width:150px; height:auto; margin:0 auto}
.gauge .g-fondo{fill:none; stroke:var(--carton-2); stroke-width:12; stroke-linecap:round}
.gauge .g-valor{fill:none; stroke:var(--c); stroke-width:12; stroke-linecap:round; transition:stroke-dasharray .2s}
.gauge .g-aguja{stroke:var(--tinta); stroke-width:3; stroke-linecap:round; transform-origin:60px 60px; transition:transform .2s}
.gauge circle{fill:var(--tinta)}
.escenario{padding:20px 18px 22px; box-shadow:5px 6px 0 var(--pieza)}
.esc-quien{display:flex; align-items:center; gap:10px; font-weight:700}
.escenario h1{margin:14px 0 16px; font-size:clamp(2rem,9vw,2.75rem); line-height:1; letter-spacing:-.03em; font-weight:800; overflow-wrap:anywhere}
.linea-t{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.linea-t li{display:grid; grid-template-columns:4.2em 1fr; gap:10px; line-height:1.35}
.esc-preg{margin:16px 0 0; padding-left:1.2em}
.mini-mandos{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin-top:16px}
.mini-mandos div{font-size:.75rem; font-weight:700; text-align:center}
.mini-mandos .gauge{max-width:64px}
.mini-mandos .g-fondo{stroke:rgba(0,0,0,.18)}
.mini-mandos .g-valor, .mini-mandos .g-aguja{stroke:var(--on-vc)}
.mini-mandos circle{fill:var(--on-vc)}
.crono{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px; margin:0 0 10px}
#crono{min-width:4.5ch; font-size:2.25rem; font-weight:800; text-align:center; font-variant-numeric:tabular-nums}
.crono.fin #crono{color:var(--mal)}
.consejo{margin:0 0 6px; color:var(--tinta-2); font-size:.9375rem; text-align:center}
.premio{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start; margin:0 0 12px; padding:16px; border:1px solid var(--linea); border-radius:16px; background:var(--carton)}
.trofeo{display:grid; place-items:center; width:48px; height:48px; border-radius:50%; background:var(--carton-2); color:var(--tinta-2)}
.trofeo svg{width:26px; height:26px}
.premio.dado .trofeo{border:2.5px solid var(--pieza); background:var(--amarillo); color:var(--on-amarillo)}
.premio h3{font-size:1.0625rem} .premio p{margin-top:2px; color:var(--tinta-2); font-size:.9375rem}
.premio .ganador{display:flex; align-items:center; gap:8px; margin-top:8px; color:var(--tinta); font-weight:700}
.premio>.btn{grid-column:1/-1; justify-self:start; min-height:40px}
.candidatos{grid-column:1/-1; display:grid; gap:8px}

function confeti(n) {

  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  const cs = getComputedStyle(document.documentElement);

}
function pasoConfeti(ctx) {
  ctx.clearRect(0, 0, innerWidth, innerHeight);

function agregados() {
  const m = new Map();
  for (const [dia, acts] of Object.entries(S.diario.dias)) {
    for (const a of (Array.isArray(acts) ? acts : [])) {
      const k = String(a.a || '').trim().toLowerCase().replace(/\s+/g, ' '); if (!k) continue;
      const o = m.get(k) || { k, nombre: String(a.a).trim(), n: 0, se: 0, sg: 0, ult: '' };
      o.n++; o.se += Number(a.en) || 0; o.sg += Number(a.eng) || 0;
      if (dia >= o.ult) { o.ult = dia; o.nombre = String(a.a).trim(); }

}

function solapa(a, b) { return a[0] < b[2] && b[0] < a[2] && a[1] < b[3] && b[1] < a[3]; }
function cuadrante(agg) {
  const W = 320, H = 226, x0 = 12, x1 = 308, y0 = 10, y1 = 214;
  const X = e => x0 + (e + 2) / 4 * (x1 - x0), Y = g => y1 - (g - 1) / 4 * (y1 - y0);
  const xm = X(0), ym = Y(3);
  const pts = agg.slice().sort((a, b) => b.n - a.n).slice(0, 14).map(o => ({ o, x: X(o.en), y: Y(o.eng), r: 5 + Math.min(o.n, 6) * 1.5 }));
  pts.forEach((p, i) => {
    for (let j = 0; j < i; j++) { const q = pts[j]; if (Math.abs(p.x - q.x) < 4 && Math.abs(p.y - q.y) < 4) { p.x += 8; p.y -= 6; } }
    p.x = clamp(p.x, x0 + p.r, x1 - p.r); p.y = clamp(p.y, y0 + p.r, y1 - p.r);
  });
  const cajas = [], desp = [0, 13, -13, 26, -26, 39, -39];
  const etiquetas = pts.map(p => {
    const txt = p.o.nombre.length > 18 ? p.o.nombre.slice(0, 17) + '…' : p.o.nombre;
    const w = txt.length * 5.9, der = p.x + p.r + 4 + w < x1;
    const lx = der ? p.x + p.r + 4 : p.x - p.r - 4;
    let ly = p.y + 4, k = 0;
    const caja = y => (der ? [lx, y - 10, lx + w, y + 2] : [lx - w, y - 10, lx, y + 2]);
    while (k < desp.length && cajas.some(c => solapa(c, caja(p.y + 4 + desp[k])))) k++;
    ly = p.y + 4 + (desp[k] || 0); cajas.push(caja(ly));
    return `<text class="et" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}"${der ? '' : ' text-anchor="end"'}>${esc(txt)}</text>`;
  });
  return `<svg class="cuadrante" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de energía con ${agg.length} actividades">
    <rect class="q-bien" x="${xm}" y="${y0}" width="${x1 - xm}" height="${ym - y0}"/>
    <rect class="q-mal" x="${x0}" y="${ym}" width="${xm - x0}" height="${y1 - ym}"/>
    <rect class="marco" x="${x0}" y="${y0}" width="${x1 - x0}" height="${y1 - y0}" rx="8"/>
    <line class="eje" x1="${x0}" y1="${ym}" x2="${x1}" y2="${ym}"/><line class="eje" x1="${xm}" y1="${y0}" x2="${xm}" y2="${y1}"/>
    <text class="ax" x="${x0 + 4}" y="${ym - 5}">drena</text><text class="ax" x="${x1 - 4}" y="${ym - 5}" text-anchor="end">carga</text>
    <text class="ax" x="${xm + 5}" y="${y0 + 13}">engancha</text><text class="ax" x="${xm + 5}" y="${y1 - 6}">aburre</text>
    ${pts.map(p => `<circle class="${p.o.en >= 0 ? 'pt-bien' : 'pt-mal'}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${p.r.toFixed(1)}"/>`).join('')}
    ${etiquetas.join('')}
  </svg>`;
}

  </button>`;
}
function vCromos() {
  if (UI.cromoEdit && UI.borrador) return vCromoForm();
  const conv = cromos('conv'), exp = cromos('exp');
  const total = Math.min(conv.length, 5) + Math.min(exp.length, 1);

  return cabecera(4, 'nivel-4', 'Álbum de cromos', 'Cada café con alguien que ya vive una de tus vidas es un cromo. Completa cinco conversaciones y un experimento.', `Llevas ${total} de 6 cromos.${foco}`)
  + `<div class="album">${[0, 1, 2, 3, 4].map(n => (conv[n] ? cromoHTML(conv[n], n) : huecoHTML('conv', n))).join('')}${exp[0] ? cromoHTML(exp[0], 5) : huecoHTML('exp', 5)}</div>
  ${extras.length ? `<div class="panel"><h2>Cromos extra</h2><ul class="extras">${extras.map(c => `<li><button class="${c.vida != null ? 'v' + (c.vida + 1) : 'v4'}" data-a="cromo-ver" data-id="${c.id}"><span class="punto"></span>${esc(c.kind === 'conv' ? c.nombre : c.titulo)}<small>${esc(fechaCorta(c.fecha))}</small></button></li>`).join('')}</ul></div>` : ''}
  ${conv.length >= 5 || exp.length >= 1 ? `<div class="fila-btn" style="margin-bottom:16px">${conv.length >= 5 ? `<button class="btn" data-a="cromo-nuevo" data-k="conv">${ico('mas')}Otra conversación</button>` : ''}${exp.length >= 1 ? `<button class="btn" data-a="cromo-nuevo" data-k="exp">${ico('mas')}Otro experimento</button>` : ''}</div>` : ''}
  <details class="panel"><summary>Guion para el café</summary><ul>
    <li>Pide veinte o treinta minutos y aclara que quieres conocer su historia, no pedir trabajo.</li>
    <li>Pregunta cómo llegó hasta ahí, cómo es un día normal y qué es lo mejor y lo peor.</li>
    <li>Fíjate en tu energía mientras habla: también es un dato.</li>
    <li>Cierra con «¿Con quién más me recomiendas hablar?».</li>

}

/* ---------- Brújula ---------- */
function vBrujula() {
  const enl = (h, t) => `<a href="#${h}">${t}</a>`;
  const A = S.subasta, conv = cromos('conv'), exp = cromos('exp');
  const mias = (S.odisea.planes.p0 || []).map((p, i) => ({ p, i })).filter(x => x.p && String(x.p.titulo || '').trim());

  const energia = !agregados().length ? `<p class="ayuda">Aún no hay datos. ${enl('diario', 'Empieza el diario')}.</p>`
    : `<div class="dos"><div><h3>Te carga</h3>${listaSimple(cargan(3).map(o => o.nombre), 'Nada todavía.')}</div><div><h3>Te drena</h3>${listaSimple(drenan(3).map(o => o.nombre), 'Nada todavía.')}</div></div>${S.diario.aprendido.trim() ? `<p class="cita">${esc(S.diario.aprendido.trim())}</p>` : ''}`;

  let valores = `<p class="ayuda">Se completa al terminar la ${enl('subasta', 'subasta de valores')}.</p>`;
  if (A.etapa === 'fin' && A.pids.includes('p0')) {
    const sc = puntosAnclas('p0');
    const top = Object.entries(sc).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k]) => cat(k));
    const caro = Object.entries(A.res).filter(([, r]) => r && r.w === 'p0').sort((a, b) => b[1].p - a[1].p)[0];
    valores = (top.length ? `<ol class="top-anclas">${top.map(c => `<li><strong>${c.t}</strong><span>${c.d}</span></li>`).join('')}</ol>` : '<p class="ayuda">No compraste nada ni elegiste imprescindibles.</p>')
      + (caro ? `<p class="nota">Por lo que más pagaste: «${esc(lote(caro[0]).t)}», ${caro[1].p} monedas.</p>` : '');
  }

  const vidas = !mias.length ? `<p class="ayuda">Diseña tus vidas en la ${enl('tres-vidas', 'noche de las tres vidas')}.</p>`
    : `<div class="vidas-res">${mias.map(({ p, i }) => {
      const pr = PREMIOS.filter(x => { const g = S.odisea.premios[x.k]; return g && g.pid === 'p0' && g.i === i; }).map(x => x.t);
      return `<div class="vida-res v${i + 1}"><span class="tag"></span><div><strong>${esc(p.titulo.trim())}</strong><span>Recursos ${p.panel.rec}, atractivo ${p.panel.atr}, confianza ${p.panel.con} y coherencia ${p.panel.coh}.${pr.length ? ' Premio: ' + pr.join(', ') + '.' : ''}</span></div></div>`;
    }).join('')}</div>`;

  let crom = `<p class="ayuda">Pega tu primer cromo en el ${enl('cromos', 'álbum')}.</p>`;
  if (conv.length || exp.length) {
    const filas = [0, 1, 2, null].map(i => {
      const cs = conv.filter(c => (i === null ? c.vida == null : c.vida === i)); if (!cs.length) return '';
      const val = cs.filter(c => c.cerca != null), media = val.length ? val.reduce((s, c) => s + c.cerca, 0) / val.length : null;
      const m = i === null ? null : mias.find(x => x.i === i);
      const nombre = i === null ? 'Sin vida concreta' : `Vida ${i + 1}${m ? ': ' + esc(m.p.titulo.trim()) : ''}`;
      return `<li class="${i === null ? 'v4' : 'v' + (i + 1)}"><div class="fila"><strong>${nombre}</strong><span>${cs.length} ${plural(cs.length, 'conversación', 'conversaciones')}</span></div>${media != null ? `<div class="escala-ca" role="img" aria-label="${media > 0 ? 'Te acerca' : media < 0 ? 'Te aleja' : 'Ni te acerca ni te aleja'}"><i style="--p:${Math.round((media + 2) / 4 * 100)}%"></i></div><div class="escala-ext"><span>Me aleja</span><span>Me acerca</span></div>` : ''}</li>`;
    }).join('');
    crom = (filas ? `<ul class="cromos-res">${filas}</ul>` : '') + (exp.length ? `<p class="nota">Experimentos: ${exp.map(e => '«' + esc(e.titulo) + '»').join(', ')}.</p>` : '');
  }

  return cabecera(ico('brujula'), 'nivel-meta', 'Tu brújula', 'Lo que has descubierto en las cuatro casillas, reunido en una página.')
  + `<section class="panel"><h2>Tu energía</h2>${energia}</section>
  <section class="panel"><h2>Lo que más valoras</h2>${valores}</section>
  <section class="panel"><h2>Tus tres vidas</h2>${vidas}</section>
  <section class="panel"><h2>Lo que dicen tus cromos</h2>${crom}</section>
  <section class="panel"><h2>Y ahora</h2>
    <label class="campo"><span>Lo que he descubierto, en una frase</span><textarea rows="3" data-bind="brujula.frase">${esc(S.brujula.frase)}</textarea></label>
    <label class="campo"><span>Mi siguiente paso</span><input type="text" data-bind="brujula.paso" maxlength="120" placeholder="Ej.: hablar con dos personas del sector salud" value="${esc(S.brujula.paso)}"></label>
    <label class="campo"><span>¿Cuándo?</span><input type="date" data-bind="brujula.cuando" value="${esc(S.brujula.cuando)}"></label>
  </section>`;
}

}

/* ---------- Navegación y pintado ---------- */
const CLASE_VISTA = { inicio: '', diario: 'nivel-1', subasta: 'nivel-2', 'tres-vidas': 'nivel-3', cromos: 'nivel-4', brujula: 'nivel-meta', ajustes: '' };
function vista() { const h = location.hash.replace(/^#/, ''); return VISTAS.includes(h) ? h : 'inicio'; }
function aplicarTema() {
  const r = document.documentElement;
  if (S.tema === 'claro') r.setAttribute('data-theme', 'light');
  else if (S.tema === 'oscuro') r.setAttribute('data-theme', 'dark');
  else r.removeAttribute('data-theme');
}
function pintarBarra(v) {
  const interna = (v === 'tres-vidas' && UI.odVista !== 'lista') || (v === 'cromos' && UI.cromoEdit);
  const atras = !!S.nombre && (v !== 'inicio' || interna);
  $('#barra-in').innerHTML = `${atras ? `<button class="btn-icono" data-a="atras" aria-label="Volver">${ico('atras')}</button>` : ''}
    <a class="marca" href="#inicio" aria-label="Tres vidas: inicio">${marca()}${v === 'inicio' && S.nombre ? '' : '<span>Tres vidas</span>'}</a>

}
const VISTA_FN = { inicio: () => vInicio(), diario: () => vDiario(), subasta: () => vSubasta(), 'tres-vidas': () => vOdisea(), cromos: () => vCromos(), brujula: () => vBrujula(), ajustes: () => vAjustes() };
function pintar(arriba) {
  const v = vista(), y = window.scrollY, app = $('#app');
  app.className = 'app ' + (S.nombre ? CLASE_VISTA[v] || '' : '');

  app.innerHTML = S.nombre ? VISTA_FN[v]() : vBienvenida();

  UI.heroAnimado = true;
  if (UI.enfocar) { const el = document.getElementById(UI.enfocar); UI.enfocar = null; if (el) el.focus(); }
  if (UI.recienPegado) { const id = UI.recienPegado; setTimeout(() => { if (UI.recienPegado === id) UI.recienPegado = null; }, 900); }
}
function vivo(t) {
  if (t.dataset.vivo === 'palabras') {
    const n = palabras(t.value), el = $('#cont-palabras');
    if (el) { el.textContent = n + ' de 6 palabras'; el.classList.toggle('ok', n === 6); }
  } else if (t.dataset.vivo === 'aguja') {
    const v = Number(t.value), g = document.getElementById('g-' + t.dataset.k), o = document.getElementById('out-' + t.dataset.k);

}

/* ---------- Cronómetro del modo escenario ---------- */
let cronoInt = null;
function pararCrono() { if (cronoInt) { clearInterval(cronoInt); cronoInt = null; } UI.crono.activo = false; }
function pintarCrono() {
  const el = $('#crono'); if (el) el.textContent = mmss(UI.crono.restante);
  const b = $('#crono-btn'); if (b) b.textContent = UI.crono.activo ? 'Pausar' : (UI.crono.restante > 0 && UI.crono.restante < S.odisea.tiempo ? 'Seguir' : 'Empezar');
  const c = $('.crono'); if (c) c.classList.toggle('fin', UI.crono.restante === 0);
}
function tic() {
  UI.crono.restante--;
  if (UI.crono.restante <= 0) { UI.crono.restante = 0; pararCrono(); aviso('¡Tiempo!'); try { if (navigator.vibrate) navigator.vibrate(200); } catch (e) { /* sin vibración */ } }
  pintarCrono();
}
function reiniciarCrono() { pararCrono(); UI.crono.restante = S.odisea.tiempo; }

/* ---------- Acciones ---------- */
const ACC = {
  empezar() {
    const n = String(UI.nombreInicial || '').trim();
    if (!n) { aviso('Escribe tu nombre para empezar.'); UI.enfocar = 'nombre-inicial'; pintar(); return; }

    if (location.hash !== '#inicio') location.hash = '#inicio'; else pintar(true);
  },
  atras() {
    const v = vista();
    if (v === 'tres-vidas' && UI.odVista !== 'lista') { reiniciarCrono(); UI.odVista = 'lista'; UI.premioAbierto = null; pintar(true); return; }
    if (v === 'cromos' && UI.cromoEdit) { UI.cromoEdit = false; UI.borrador = null; pintar(true); return; }
    location.hash = '#inicio';
  },
  'logro-info'(d) { const l = LOGROS.find(x => x.k === d.k); if (l) aviso(`${l.t}: ${l.d}${S.logros.includes(l.k) ? '' : ' Aún pendiente.'}`); },

  /* Diario */
  'tab-diario'(d) { UI.diarioTab = d.t; pintar(); },
  'dia-ant'() { UI.diaSel = sumarDias(UI.diaSel, -1); pintar(); },
  'dia-sig'() { if (UI.diaSel < HOY()) { UI.diaSel = sumarDias(UI.diaSel, 1); pintar(); } },
  'nueva-eng'(d) { UI.nueva.eng = Number(d.v); pintar(); },
  'nueva-en'(d) { UI.nueva.en = Number(d.v); pintar(); },
  'anadir-act'() {
    const a = String(UI.nueva.a || '').trim();
    if (!a) { aviso('Escribe qué hiciste.'); UI.enfocar = 'act-nombre'; pintar(); return; }
    if (!UI.nueva.eng) { aviso('Marca cuánto te enganchó.'); return; }
    if (UI.nueva.en === null) { aviso('Marca cómo quedó tu energía.'); return; }
    const dia = UI.diaSel, primera = !tiene(dia);
    if (!Array.isArray(S.diario.dias[dia])) S.diario.dias[dia] = [];
    S.diario.dias[dia].push({ id: uid(), a, eng: UI.nueva.eng, en: UI.nueva.en });
    UI.nueva = { a: '', eng: 0, en: null }; UI.enfocar = 'act-nombre';
    guardar(); pintar();
    if (primera && dia === HOY()) { const r = racha(); aviso(r > 1 ? `Día anotado. Racha de ${r} días.` : 'Día anotado.'); }
  },
  'borrar-act'(d) {
    const a = S.diario.dias[UI.diaSel]; if (!Array.isArray(a)) return;
    S.diario.dias[UI.diaSel] = a.filter(x => x.id !== d.id);
    if (!S.diario.dias[UI.diaSel].length) delete S.diario.dias[UI.diaSel];
    guardar(); pintar();
  },
  'meta-diario'() { S.diario.meta = S.diario.meta === 14 ? 21 : 14; guardar(); pintar(); },

  /* Participantes */
  'anadir-jugador'() {
    const n = String(UI.nuevoJugador || '').trim();
    if (!n) { aviso('Escribe un nombre.'); UI.enfocar = 'nuevo-jugador'; pintar(); return; }
    if (S.jugadores.length >= 6) return;
    S.jugadores.push({ id: 'p' + S.seq++, nombre: n }); UI.nuevoJugador = ''; UI.enfocar = 'nuevo-jugador';
    guardar(); pintar();
  },
  async 'quitar-jugador'(d) {
    const A = S.subasta;
    if ((A.etapa === 'secreto' || A.etapa === 'puja') && A.pids.includes(d.id)) { aviso('No se puede quitar a alguien con la subasta en marcha.'); return; }
    const j = jugador(d.id), tiene3 = Array.isArray(S.odisea.planes[d.id]) && S.odisea.planes[d.id].some(p => !planVacio(p));
    if (tiene3 && !(await confirmar(`Se borrarán también las vidas de ${j.nombre}. ¿Quitar a ${j.nombre}?`, 'Quitar'))) return;
    S.jugadores = S.jugadores.filter(x => x.id !== d.id);
    delete S.odisea.planes[d.id];
    for (const k of Object.keys(S.odisea.premios)) if (S.odisea.premios[k] && S.odisea.premios[k].pid === d.id) delete S.odisea.premios[k];
    guardar(); pintar();
  },

  /* Subasta */
  'modo-sub'(d) { S.subasta.modo = d.v; guardar(); pintar(); },
  'sub-empezar'() {
    if (S.jugadores.length < 2) return;
    const A = S.subasta;
    Object.assign(A, { etapa: 'secreto', orden: barajar(LOTES.filter(l => A.modo === 'completa' || l.r).map(l => l.id)), idx: 0, res: {}, historial: [], secretos: {}, turno: 0, pids: S.jugadores.map(j => j.id), notas: {} });
    UI.secretoVisible = false; UI.secretoSel = []; guardar(); pintar(true);
  },
  'secreto-ver'() { UI.secretoVisible = true; UI.secretoSel = []; pintar(true); },
  'secreto-toggle'(d) {
    const s = UI.secretoSel, k = s.indexOf(d.id);
    if (k >= 0) s.splice(k, 1); else if (s.length >= 5) { aviso('Ya tienes cinco. Quita uno para cambiarlo.'); return; } else s.push(d.id);
    pintar();
  },
  'secreto-guardar'() {
    const A = S.subasta; if (UI.secretoSel.length !== 5) return;
    A.secretos[A.pids[A.turno]] = UI.secretoSel.slice(); A.turno++;
    UI.secretoVisible = false; UI.secretoSel = [];
    if (A.turno >= A.pids.length) { A.etapa = 'puja'; UI.pujador = null; UI.precio = PUJA_MIN; aviso('¡Empieza la subasta!'); }
    guardar(); pintar(true);
  },
  pujador(d) { UI.pujador = UI.pujador === d.id ? null : d.id; pintar(); },
  precio(d) { UI.precio = clamp(UI.precio + Number(d.d), PUJA_MIN, PRESUPUESTO); pintar(); },
  'precio-max'() { if (UI.pujador) { UI.precio = clamp(restante(UI.pujador), PUJA_MIN, PRESUPUESTO); pintar(); } },
  adjudicar() {
    const A = S.subasta, pid = UI.pujador; if (!pid) return;
    const q = restante(pid); if (UI.precio > q) { aviso(`A ${jugador(pid).nombre} solo le quedan ${q} monedas.`); return; }
    const id = A.orden[A.idx]; A.res[id] = { w: pid, p: UI.precio }; A.historial.push(id); A.idx++;
    sello('¡Adjudicado!', `${jugador(pid).nombre}, ${UI.precio} monedas`);
    UI.pujador = null; UI.precio = PUJA_MIN;
    if (A.idx >= A.orden.length) { A.etapa = 'fin'; UI.subRes = 'p0'; }
    guardar(); pintar(A.etapa === 'fin');
  },
  desierto() {
    const A = S.subasta, id = A.orden[A.idx]; if (!id) return;
    A.res[id] = { w: null, p: 0 }; A.historial.push(id); A.idx++;
    sello('Desierto', 'Nadie lo quiso');
    UI.pujador = null; UI.precio = PUJA_MIN;
    if (A.idx >= A.orden.length) { A.etapa = 'fin'; UI.subRes = 'p0'; }
    guardar(); pintar(A.etapa === 'fin');
  },
  deshacer() {
    const A = S.subasta, id = A.historial.pop(); if (!id) return;
    delete A.res[id]; A.idx = A.historial.length; if (A.etapa === 'fin') A.etapa = 'puja';
    UI.pujador = null; UI.precio = PUJA_MIN; guardar(); pintar(true); aviso('Último lote deshecho.');
  },
  'ver-res'(d) { UI.subRes = d.id; pintar(); },
  async 'sub-abandonar'() { if (await confirmar('¿Abandonar la subasta? Se perderá lo pujado hasta ahora.', 'Abandonar')) reiniciarSubasta(); },
  async 'sub-reiniciar'() { if (await confirmar('¿Jugar otra subasta? Se borrarán los resultados de esta.', 'Jugar otra vez')) reiniciarSubasta(); },

  /* Tres vidas */
  'od-editar'(d) { asegurarPlanes(d.pid); UI.odEdit = { pid: d.pid, i: Number(d.i) }; UI.odVista = 'editar'; pintar(true); },
  'od-listo'() { UI.odVista = 'lista'; UI.odEdit = null; pintar(true); },
  'od-escenario'() { UI.escIdx = 0; reiniciarCrono(); UI.odVista = 'escenario'; pintar(true); },
  'od-premios'() { reiniciarCrono(); UI.premioAbierto = null; UI.odVista = 'premios'; pintar(true); },
  'od-volver'() { reiniciarCrono(); UI.odVista = 'lista'; pintar(true); },
  'od-foco'(d) { const i = Number(d.i); S.odisea.foco = S.odisea.foco === i ? null : i; guardar(); pintar(); },
  'esc-ant'() { reiniciarCrono(); UI.escIdx = Math.max(0, UI.escIdx - 1); pintar(true); },
  'esc-sig'() {
    reiniciarCrono();
    if (UI.escIdx >= listaEscenario().length - 1) { UI.odVista = 'premios'; UI.premioAbierto = null; } else UI.escIdx++;
    pintar(true);
  },
  'crono-toggle'() {
    if (UI.crono.activo) pararCrono();
    else { if (UI.crono.restante <= 0) UI.crono.restante = S.odisea.tiempo; UI.crono.activo = true; cronoInt = setInterval(tic, 1000); }
    pintarCrono();
  },
  'crono-dur'() {
    const ops = [120, 180, 300], k = ops.indexOf(S.odisea.tiempo);
    S.odisea.tiempo = ops[(k + 1) % ops.length]; guardar(); reiniciarCrono(); pintar();
  },
  'premio-abrir'(d) { UI.premioAbierto = UI.premioAbierto === d.k ? null : d.k; pintar(); },
  'premio-dar'(d) {
    S.odisea.premios[d.k] = { pid: d.pid, i: Number(d.i) }; UI.premioAbierto = null;
    guardar(); pintar(); confeti(70);
    const pr = PREMIOS.find(x => x.k === d.k); aviso(`${pr ? pr.t : 'Premio'}: ¡para ${jugador(d.pid).nombre}!`);
  },

  /* Álbum */
  'cromo-nuevo'(d) {
    UI.borrador = { id: null, kind: d.k, nombre: '', rol: '', titulo: '', vida: S.odisea.foco != null ? S.odisea.foco : null, sorpresa: '', aprendido: '', cerca: null, energia: null, repetir: null, fecha: HOY() };
    UI.cromoEdit = true; UI.enfocar = null; pintar(true);
  },
  'cromo-ver'(d) {
    const c = S.album.cromos.find(x => x.id === d.id); if (!c) return;
    UI.borrador = JSON.parse(JSON.stringify(c)); UI.cromoEdit = true; pintar(true);
  },
  'cromo-campo'(d) {
    const b = UI.borrador; if (!b) return;
    let v = d.v;
    if (d.f === 'vida') { b.vida = v === 'x' ? null : Number(v); pintar(); return; }
    if (d.f === 'cerca' || d.f === 'energia') v = Number(v);
    b[d.f] = b[d.f] === v ? null : v; pintar();
  },
  'cromo-guardar'() {
    const b = UI.borrador; if (!b) return;
    const conv = b.kind === 'conv';
    if (conv && !String(b.nombre || '').trim()) { aviso('Escribe con quién hablaste.'); UI.enfocar = 'c-nombre'; pintar(); return; }
    if (!conv && !String(b.titulo || '').trim()) { aviso('Escribe qué probaste.'); UI.enfocar = 'c-nombre'; pintar(); return; }
    const c = Object.assign({}, b, { nombre: String(b.nombre || '').trim(), rol: String(b.rol || '').trim(), titulo: String(b.titulo || '').trim() });
    let nuevo = false;
    if (!c.id) { c.id = uid(); S.album.cromos.push(c); UI.recienPegado = c.id; nuevo = true; }
    else { const k = S.album.cromos.findIndex(x => x.id === c.id); if (k >= 0) S.album.cromos[k] = c; }
    UI.cromoEdit = false; UI.borrador = null;
    guardar(); pintar(true);
    aviso(nuevo ? (conv ? '¡Cromo pegado!' : '¡Experimento pegado!') : 'Cambios guardados.');
  },
  'cromo-cancelar'() { UI.cromoEdit = false; UI.borrador = null; pintar(true); },
  async 'cromo-borrar'() {
    const b = UI.borrador; if (!b || !b.id) return;
    if (!(await confirmar('¿Quitar este cromo del álbum?', 'Quitar'))) return;
    S.album.cromos = S.album.cromos.filter(x => x.id !== b.id); UI.cromoEdit = false; UI.borrador = null;
    guardar(); pintar(true);
  },

  /* Ajustes */
  tema(d) { S.tema = d.v; guardar(); aplicarTema(); pintar(); },
  'guardar-nombre'() {
    const n = String(UI.nombreEdit || '').trim();
    if (!n) { aviso('El nombre no puede quedar vacío.'); return; }
    S.nombre = n; S.jugadores[0].nombre = n; guardar(); pintar(); aviso('Nombre guardado.');
  },
  'copia-generar'() { UI.copiaTexto = 'TV1:' + aB64(JSON.stringify(S)); pintar(); },
  async 'copia-copiar'() {
    const ta = $('#copia');
    try { await navigator.clipboard.writeText(UI.copiaTexto); aviso('Código copiado.'); return; } catch (e) { /* sin portapapeles */ }
    if (ta) { ta.focus(); ta.select(); try { if (document.execCommand('copy')) { aviso('Código copiado.'); return; } } catch (e) { /* sin copia */ } }
    aviso('Selecciona el código y cópialo a mano.');
  },
  async restaurar() {
    const t = String(UI.restaurarTexto || '').trim();
    if (!t.startsWith('TV1:')) { aviso('Ese código no es de Tres vidas.'); return; }
    let datos; try { datos = JSON.parse(deB64(t.slice(4))); } catch (e) { aviso('El código está incompleto o dañado.'); return; }
    if (!(await confirmar('Esto sustituye todo tu progreso actual por el del código. ¿Seguir?', 'Restaurar'))) return;
    S = normalizar(datos); S.logros = Array.isArray(S.logros) ? S.logros : []; UI.restaurarTexto = ''; UI.copiaTexto = ''; UI.nombreEdit = null;
    guardar(); aplicarTema(); aviso('Progreso restaurado.');
    if (location.hash !== '#inicio') location.hash = '#inicio'; else pintar(true);
  },
  async 'borrar-todo'() {
    if (!(await confirmar('Se borrará todo tu progreso. No se puede deshacer.', 'Borrar todo'))) return;
    S = estadoInicial(); Object.assign(UI, { nombreEdit: null, copiaTexto: '', restaurarTexto: '', nombreInicial: '', heroAnimado: false });
    guardar(); aplicarTema();
    if (location.hash) location.hash = ''; pintar(true);
  }
};
function reiniciarSubasta() {
  Object.assign(S.subasta, { etapa: 'preparar', orden: [], idx: 0, res: {}, historial: [], secretos: {}, turno: 0, pids: [], notas: {} });
  UI.pujador = null; UI.precio = PUJA_MIN; UI.secretoVisible = false; UI.secretoSel = [];
  guardar(); pintar(true);
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b || b.disabled) return;
  const f = ACC[b.dataset.a]; if (!f) return;
  e.preventDefault(); f(b.dataset, b);
});
document.addEventListener('input', e => {
  const t = e.target; if (!t || !t.dataset) return;
  if (t.dataset.bind) { fijar(S, t.dataset.bind, t.type === 'range' ? Number(t.value) : t.value); guardar(); vivo(t); }
  else if (t.dataset.ui) { fijar(UI, t.dataset.ui, t.value); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t && t.tagName === 'INPUT' && t.dataset && t.dataset.enter) { e.preventDefault(); const f = ACC[t.dataset.enter]; if (f) f(t.dataset, t); }
});
window.addEventListener('hashchange', () => { reiniciarCrono(); UI.odVista = 'lista'; UI.cromoEdit = false; UI.borrador = null; UI.premioAbierto = null; UI.nombreEdit = null; UI.copiaTexto = ''; pintar(true); });

/* ---------- Arranque ---------- */
UI.crono.restante = S.odisea.tiempo || 180;
revisarLogros(true);
aplicarTema();
pintar(true);
setTimeout(iniciarRemoto, 50);
})();
</script>
